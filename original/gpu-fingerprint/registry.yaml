# GPU signature registry for the fingerprint tool: one entry per distinct signature (a GPU, driver, backend,
# interface and browser combination). A numeric signature is filed under its interface and the mode it was taken in:
# webgpu-split, webgl2-split or webgl1-split when each expression was compiled in a shader of its own, and the
# -combined forms when all were compiled in one shader, because the two can differ on one device. canvas is a classic
# 2-D canvas fingerprint kept for comparison: the page's own scene, read with getImageData from a canvas the page
# made. canvas-browserleaks is the BrowserLeaks canvas test, read with toDataURL from a canvas made in a sandboxed
# frame; its md5 result is the signature that site shows. The interface names are the page's to choose: server.py
# files a result under whatever name the page gives it, so a new mechanism brings its own name. A signature can be
# shared by several devices, so a label names every device, browser and backend it has been seen on; when a new one
# matches an existing entry, extend that label rather than add a duplicate.
# A new signature is appended as a block; a repeat submission of a known one is folded into that entry instead of
# duplicated, widening its timing range. Each result is keyed by a name its mechanism gives it (a probe, a hash lane)
# so fields can be added. Run times are in ms and kept apart by kind of run, because a browser keeps compiled
# shaders: first_ms_min / first_ms_max for the first run after the page loads, repeat_ms_min / repeat_ms_max for
# later runs on the same page.
# An interface a browser blocks or does not offer is recorded as an entry with "blocked: true" and a "reason"
# instead of results, so the registry also shows which browsers withhold which interface, and why.
# An entry taken in a private (incognito) window carries "window: private" and is never folded into a normal
# window's entry, even when the two hold the same results, because some browsers behave differently there.
# Written and read by server.py (the POST /register endpoint) and read by probe.js. See README.md.
