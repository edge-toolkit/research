[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77"]

[project]
dependencies = [
  "numpy>=1.26",
  "pillow==12.3.0",
  "scipy>=1.12",
  "torch==2.12.1",
  "torchvision==0.27.1",
  "websocket-client>=1.8,<2",
]
description = "Vessel classification demo using Edge Toolkit communication and recovery"
name = "et-harbour-fl"
requires-python = ">=3.11"
version = "0.1.0"

[project.optional-dependencies]
detection = ["onnxruntime>=1.23,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harbour_fl = ["pretrained_assets.json"]
