# Repository-wide tooling: the basic checks, run with `mise run check`.
# Each reproduction under reproductions/ has its own mise.toml for running it; see its README.

min_version = "2026.9.0"

[settings]
# Fail fast on a missing tool rather than installing it mid-task; `mise install` is the one place tools arrive.
exec_auto_install = false
task.run_auto_install = false
# Lock every tool resolution to the mise.lock committed beside each config, here and in each reproduction.
# The lock pins each `latest` to a concrete version + checksum, so a checkout installs what was last locked rather
# than whatever was released since. `lockfile = true` also keeps it updated on installs. Refresh with `mise lock`
# in the config's directory; `mise lock --bump` re-resolves the `latest` selectors for a deliberate tool refresh.
lockfile = true
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64", "macos-x64", "windows-x64"]

[env]
# taplo has no discovery beyond its working directory, so point it at the config beside the other checkers'.
TAPLO_CONFIG = "{{ config_root }}/config/taplo.toml"

[tools]
"aqua:gitleaks/gitleaks" = "latest"
dprint = "latest"
editorconfig-checker = "latest"
# Reading pull request checks and review comments; see AGENTS.md.
gh = "latest"
# Upstream publishes binaries only for Linux and macOS arm64.
"github:zhupanov/agent-lint" = { version = "latest", os = ["linux", "macos/arm64"] }
ripgrep = "latest"
ruff = "latest"
taplo = "latest"
typos = "latest"
yq = "latest"

[tasks.check]
depends = ["*-check"]
description = "Run all checks"

[tasks.fmt]
depends = ["*-fmt"]
description = "Apply all formatters"

[tasks.test-experiments]
description = "Run the shared experiment controllers' application-independent tests"
run = "mise -C experiments/reliability-benchmarks/controllers run test"

[tasks.benchmark-ui]
description = "Run the standalone benchmark UI; supply --catalog and serve or list"
run = "mise -C experiments/reliability-benchmarks run benchmark-ui"

[tasks.agent-lint-check]
description = "Lint the agent configuration, AGENTS.md (agent-lint)"
# The tool is os-scoped to the platforms upstream publishes for, which cannot exclude macOS x86_64 on its own.
run = """
if [ "$(uname -s)" = "Darwin" ] && [ "$(uname -m)" != "arm64" ]; then
  echo "agent-lint-check: upstream publishes no macOS x86_64 binary; nothing to check on this host"
  exit 0
fi
agent-lint .
"""

# Removes what `mise install` and each reproduction's `mise run setup` rebuild, which includes tiny-training's TVM
# build. It keeps what was downloaded or produced by a run: the datasets, the hub's agent storage and the
# deployment's credential.
#
# mise prune parses every config mise has tracked on this machine, and fails on one whose [tools] use its own [vars],
# as edge-toolkit/core's do: "failed to parse template {{ vars.rust_nightly }}" with "Field `rust_nightly` is not
# defined." The fixes, jdx/mise#12188 and jdx/mise#14008, were closed unmerged, so the task carries on to the
# artifacts when the prune fails.
[tasks.clean]
description = "Remove unused versions of this repository's mise tools, and built artifacts"
run = """
set -eu
dry_run=""
if [ "${usage_dry_run:-false}" = "true" ]; then dry_run="--dry-run"; fi
# Only the tools this repository names; mise prune keeps any version another tracked config still uses.
tools="$(git ls-files '*mise.toml' | while read -r config; do
  mise -C "$(dirname "$config")" ls --local --json 2>/dev/null | yq -p json 'keys | .[]'
done | sort -u)"
# $tools is a word-split list by design; do not quote it.
if ! mise prune --tools --yes $dry_run $tools; then
  echo "clean: mise prune failed (above), so no tool versions were removed; continuing with built artifacts" >&2
fi
# Each `-e '!…'` un-ignores a path, which -X then leaves alone. The doubled -f also removes the upstream checkouts
# tiny-training's setup clones, and -n, when given, wins over it.
git clean -d -X -f -f ${dry_run:+-n} \\
  -e '!reproductions/split-learning-mit/deployment/secrets.env' \\
  -e '!reproductions/split-learning-mit/deployment/storage/' \\
  -e '!reproductions/tiny-training-mit/modules/zig-te-train1/.sample-pack-cache/'
# The submodule's own data/external/.gitignore outranks `-e`, so name what to clean rather than what to keep.
git -C reproductions/split-learning-mit/upstream clean -d -X -f ${dry_run:+-n} -- apps packages
"""
usage = 'flag "-n --dry-run" help="List what would be removed without removing it"'

[tasks.dprint-check]
description = "Check Markdown, JSON and YAML formatting (dprint)"
run = "dprint check"

[tasks.dprint-fmt]
description = "Format Markdown, JSON and YAML (dprint)"
run = "dprint fmt"

[tasks.editorconfig-check]
description = "Check every file against .editorconfig (editorconfig-checker)"
run = "editorconfig-checker -config config/editorconfig-checker.json"

[tasks.gitleaks-check]
description = "Scan the working tree for committed secrets (gitleaks)"
run = "gitleaks dir . --config config/gitleaks.toml --no-banner"

# Fail when a committed mise.lock no longer matches what its config resolves: a tool added, removed or re-pinned in a
# mise.toml without regenerating the lock beside it. `mise lock` keeps the locked version of an unchanged `latest`,
# and covers every platform in lockfile_platforms, so a lock that is up to date regenerates byte for byte. Each lock
# is compared with its own contents before regenerating rather than with the index, so a refreshed but not yet staged
# lock passes. Every committed mise.toml needs a committed lock beside it.
[tasks.mise-lock-check]
description = "Check every committed mise.toml has a committed mise.lock that is up to date with it"
run = """
set -eu
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT
failed=0
for config in $(git ls-files '*mise.toml'); do
  lock="$(dirname "$config")/mise.lock"
  if ! git ls-files --error-unmatch "$lock" >/dev/null 2>&1; then
    echo "$config has no committed mise.lock; run \\`mise lock\\` beside it and commit the result" >&2
    failed=1
  fi
done
i=0
for lock in $(git ls-files '*mise.lock'); do
  i=$((i + 1))
  if [ -f "$lock" ]; then cp "$lock" "$tmp/$i"; else : > "$tmp/$i"; fi
  mise -C "$(dirname "$lock")" lock --quiet
  if ! diff -u --label "$lock (before)" --label "$lock (regenerated)" "$tmp/$i" "$lock"; then
    echo "$lock is out of date with its mise.toml; run \\`mise lock\\` beside it and commit the result" >&2
    failed=1
  fi
done
exit "$failed"
"""

[tasks.ruff-check]
description = "Lint Python (ruff)"
run = "ruff check"

[tasks.ruff-fmt-check]
description = "Check Python formatting (ruff)"
run = "ruff format --check"

[tasks.ruff-fmt]
description = "Format Python (ruff)"
run = "ruff format"

[tasks.taplo-check]
description = "Lint TOML and check its formatting (taplo)"
run = """
taplo lint
taplo format --check
"""

[tasks.taplo-fmt]
description = "Format TOML (taplo)"
run = "taplo format"

[tasks.typos-check]
description = "Check spelling (typos)"
run = "typos --config config/typos.toml"

[tasks.typos-fix]
description = "Correct spelling (typos)"
run = "typos --config config/typos.toml --write-changes"
