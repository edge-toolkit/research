global
  maxconn 60000
  stats socket ipv4@0.0.0.0:9999 level admin
defaults
  mode http
  timeout connect 2s
  timeout client 30s
  timeout server 30s
  timeout tunnel 10m
  timeout check 1s
frontend entry
  bind :8080
  default_backend hubs
backend hubs
  option httpchk GET /health
  http-check expect status 200
  http-response set-header X-Benchmark-Hub %[srv_name]
  server a hub-a:8080 check inter 500ms fall 2 rise 600 on-marked-down shutdown-sessions
  server b hub-b:8080 check inter 500ms fall 2 rise 2 backup
listen stats
  bind :8404
  stats enable
  stats uri /stats
